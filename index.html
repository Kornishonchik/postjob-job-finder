<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <img src="design/Logo.png" alt="PostJob Logo">

            <nav class="header__nav">
                <ul class="header__list">
                    <li><a href="#">AI Cover Letter Generator</a></li>
                    <li><a href="#">Resume Template</a></li>
                    <li><a href="#">Pricing</a></li>
                </ul>
            </nav>

            <div class="buttons">
                <a href="#" class="button-1">Sign In</a>
                <a href="#" class="button-2">Get Started</a>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="hero__container">
                <h1 class="hero__title"><span class="hero__title-style">Win your dream job</span> with PostJob</h1>
                <p class="hero__subtitle">Submit better job app — 10x faster. AI cover letter<br>generator, resume keyword checker, outreach message<br>writer, and more. Powered by GPT</p>
                <form class="hero__form">
                    <input type="email" placeholder="Your Email">
                    <button class="submit" type="submit">Start For Free</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
